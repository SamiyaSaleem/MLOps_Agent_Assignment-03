name: MLOps Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Verify Python syntax
        run: |
          python -m compileall -q agent api training tests

      - name: Run automated tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify Dockerfile exists
        run: |
          test -s Dockerfile
          test -s requirements-inference.txt
          test -s kubernetes/deployment.yaml
          test -s kubernetes/service.yaml
          test -s kubernetes/configmap.yaml

      - name: Build Docker image
        run: |
          docker build -t mlops-inference:ci .

      - name: Test Docker container health
        run: |
          docker run -d --name mlops-ci-test -p 8002:8000 mlops-inference:ci

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8002/ready > /dev/null; then
              break
            fi
            sleep 2
          done

          curl --fail --show-error http://127.0.0.1:8002/health
          curl --fail --show-error http://127.0.0.1:8002/ready

      - name: Show container logs on failure
        if: failure()
        run: docker logs mlops-ci-test 2>/dev/null || true

      - name: Clean up Docker container
        if: always()
        run: docker rm -f mlops-ci-test 2>/dev/null || true
