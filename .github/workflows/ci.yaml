name: MLOps Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Verify Python syntax
        run: |
          python -m compileall -q agent api training tests

      - name: Run automated tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify Dockerfile exists
        run: |
          test -s Dockerfile
          test -s requirements-inference.txt
          test -s kubernetes/deployment.yaml
          test -s kubernetes/service.yaml
          test -s kubernetes/configmap.yaml
