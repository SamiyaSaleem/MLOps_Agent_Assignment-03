apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-inference
  namespace: mlops-agent
  labels:
    app: mlops-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlops-inference
  template:
    metadata:
      labels:
        app: mlops-inference
    spec:
      containers:
        - name: inference-api
          image: mlops-inference:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 8000
              name: http

          envFrom:
            - configMapRef:
                name: mlops-inference-config

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
